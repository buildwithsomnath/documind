services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U documind -d documind" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind-backend
    environment:
      DATABASE_URL: postgresql://documind:${POSTGRES_PASSWORD}@db:5432/documind
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_TEMPERATURE: 0.2
      LLM_MAX_OUTPUT_TOKENS: 1024
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 100
      RRF_K: 60
    ports:
      - "5000:5000"
    volumes:
      - documind_uploads:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: documind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  documind_uploads:
